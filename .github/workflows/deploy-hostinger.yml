name: Deploy Hospitalarias to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hospitalarias
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy static site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GITHUB_BRANCH: main
      HOSTINGER_DOMAIN: hospitalarias.in
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      DEPLOY_ARCHIVE: hospitalarias_astro_dist.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        run: test -n "$HOSTINGER_API_TOKEN"

      - name: Build Astro site
        env:
          PUBLIC_GA_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          PUBLIC_GSC_VERIFICATION: ${{ secrets.GSC_VERIFICATION }}
        run: npm run build

      - name: Write panel config
        env:
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
          PANEL_GITHUB_TOKEN: ${{ secrets.PANEL_GITHUB_TOKEN }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          if (!process.env.PANEL_PASSWORD || !process.env.PANEL_GITHUB_TOKEN) {
            console.log('PANEL_PASSWORD/PANEL_GITHUB_TOKEN not set — skipping panel-config.php');
            process.exit(0);
          }
          const esc = (s) => s.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
          const lines = [
            '<?php',
            'return [',
            "  'github_token'   => '" + esc(process.env.PANEL_GITHUB_TOKEN) + "',",
            "  'github_repo'    => 'TonyBlanco/hospitalarias.in',",
            "  'github_branch'  => 'main',",
            "  'panel_password' => '" + esc(process.env.PANEL_PASSWORD) + "',",
            '];',
            '',
          ];
          fs.writeFileSync('dist/panel-config.php', lines.join('\n'));
          console.log('panel-config.php written to dist');
          EOF

      - name: Package static output
        run: |
          cd dist
          zip -qr "../$DEPLOY_ARCHIVE" .

      - name: Deploy to Hostinger
        run: node scripts/deploy-hostinger.mjs
